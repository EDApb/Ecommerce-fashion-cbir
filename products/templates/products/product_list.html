<style>
    img {
        width: 200px;
        height: 250px;
        object-fit: cover;
    }
</style>
<h1>Catalogo</h1>
{% for product in products %}
    <div>
        <h2>{{ product.name}}</h2>
        <p>{{ product.description}}</p>
        <p>Price: ${{ product.price}}</p>
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
    </div>

{% endfor %}
