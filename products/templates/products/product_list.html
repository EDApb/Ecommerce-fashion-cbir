<style>
    img {
        width: 200px;
        height: 250px;
        object-fit: cover;
    }
</style>
<h1>Catalogo</h1>
{% for product in products %}
    <div>
   <h2><a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a></h2>
        <p>{{ product.description}}</p>
        <p>Prezzo: €{{ product.price}}</p>
        <p>Taglia: {{ product.size }}</p>
        <img src="{{ product.image.url }}" alt="{{ product.name }}">

    </div>

{% endfor %}
