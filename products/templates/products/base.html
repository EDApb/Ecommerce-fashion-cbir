<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fashion Shop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'product_list' %}">Fashion Shop</a>
            <form class="d-flex" method="get" action="{% url 'product_search' %}">
                <input class="form-control me-2" type="text" name="q" value="{{ query }}" placeholder="Cerca...">
                <button class="btn btn-outline-light" type="submit">Cerca</button>
            </form>
        
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
